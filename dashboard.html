<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin Panel Dashboard — ERP management interface." />
  <title>Dashboard — Admin Panel</title>

  <!-- 1. Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- 2. Centralized color variables -->
  <link rel="stylesheet" href="assets/css/variables.css" />

  <!-- 3. Minimal custom styles -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<!--
  Root layout:
    h-screen + overflow-hidden → locks page to viewport height
    flex (row) → sidebar | right-panel sit side-by-side
-->
<body class="h-screen flex overflow-hidden font-sans antialiased bg-[var(--color-background)]">


  <!-- ══════════════════════════════════════════════════
       SIDEBAR  — full viewport height, desktop only
  ══════════════════════════════════════════════════ -->
  <aside
    id="sidebar"
    aria-label="Main navigation"
    class="hidden lg:flex flex-col
           w-64 shrink-0 h-full
           bg-[var(--color-sidebar-bg)]
           border-r border-[var(--color-sidebar-border)]"
  >

    <!-- Logo area (matches header height) -->
    <div
      class="flex items-center justify-center
             h-16 px-6 shrink-0
             border-b border-[var(--color-border)]"
      aria-label="Company logo"
    >
      <!--
        Replace with real logo when ready:
          <img src="assets/images/logo.png" alt="Company Logo" class="h-8 w-auto object-contain" />
      -->
      <span
        class="text-xs font-semibold tracking-widest uppercase
               text-[var(--color-text-muted)]
               border border-dashed border-[var(--color-border)]
               rounded px-4 py-2 select-none"
      >
        LOGO
      </span>
    </div>

    <!-- Navigation (scrolls if items overflow) -->
    <nav
      class="flex-1 overflow-y-auto py-4 px-3"
      aria-label="Sidebar navigation"
    >
      <ul role="list" class="space-y-0.5">

        <!-- Dashboard (ACTIVE) -->
        <li>
          <a
            href="dashboard.html"
            aria-current="page"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-semibold
                   bg-[var(--color-nav-active-bg)]
                   text-[var(--color-nav-active-text)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Dashboard
          </a>
        </li>

        <!-- Clients -->
        <li>
          <a
            href="clients-list.html"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-medium
                   text-[var(--color-text-secondary)]
                   hover:bg-[var(--color-nav-hover-bg)]
                   hover:text-[var(--color-text-primary)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                   transition-colors duration-150"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Clients
          </a>
        </li>

        <!-- Jobs -->
        <li>
          <a
            href="jobs-list.html"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-medium
                   text-[var(--color-text-secondary)]
                   hover:bg-[var(--color-nav-hover-bg)]
                   hover:text-[var(--color-text-primary)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                   transition-colors duration-150"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
            Jobs
          </a>
        </li>

        <!-- Workers -->
        <li>
          <a
            href="workers-list.html"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-medium
                   text-[var(--color-text-secondary)]
                   hover:bg-[var(--color-nav-hover-bg)]
                   hover:text-[var(--color-text-primary)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                   transition-colors duration-150"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Workers
          </a>
        </li>

        <!-- Reports -->
        <li>
          <a
            href="reports.html"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-medium
                   text-[var(--color-text-secondary)]
                   hover:bg-[var(--color-nav-hover-bg)]
                   hover:text-[var(--color-text-primary)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                   transition-colors duration-150"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6"  y1="20" x2="6"  y2="14"/>
            </svg>
            Reports
          </a>
        </li>

        <!-- Settings -->
        <li>
          <a
            href="#"
            class="flex items-center gap-3
                   px-3 py-2.5 rounded-lg
                   text-sm font-medium
                   text-[var(--color-text-secondary)]
                   hover:bg-[var(--color-nav-hover-bg)]
                   hover:text-[var(--color-text-primary)]
                   focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                   transition-colors duration-150"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" class="shrink-0">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06
                       a2 2 0 0 1-2.83 2.83l-.06-.06
                       a1.65 1.65 0 0 0-1.82-.33
                       1.65 1.65 0 0 0-1 1.51V21
                       a2 2 0 0 1-4 0v-.09
                       A1.65 1.65 0 0 0 9 19.4
                       a1.65 1.65 0 0 0-1.82.33l-.06.06
                       a2 2 0 0 1-2.83-2.83l.06-.06
                       A1.65 1.65 0 0 0 4.68 15
                       1.65 1.65 0 0 0 3.17 14H3
                       a2 2 0 0 1 0-4h.09
                       A1.65 1.65 0 0 0 4.6 9
                       a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                       a2 2 0 0 1 2.83-2.83l.06.06
                       A1.65 1.65 0 0 0 9 4.68
                       1.65 1.65 0 0 0 10 3.17V3
                       a2 2 0 0 1 4 0v.09
                       a1.65 1.65 0 0 0 1 1.51
                       1.65 1.65 0 0 0 1.82-.33l.06-.06
                       a2 2 0 0 1 2.83 2.83l-.06.06
                       A1.65 1.65 0 0 0 19.4 9
                       1.65 1.65 0 0 0 20.83 10H21
                       a2 2 0 0 1 0 4h-.09
                       a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </a>
        </li>

      </ul>
    </nav>
    <!-- End nav -->

    <!-- User profile (pinned to sidebar bottom) -->
    <div
      class="shrink-0
             border-t border-[var(--color-border)]
             px-4 py-4"
    >
      <div class="flex items-center gap-3 min-w-0">
        <span
          class="flex items-center justify-center
                 w-9 h-9 rounded-full shrink-0
                 bg-[var(--color-primary-light)]
                 text-[var(--color-primary)]"
          aria-hidden="true"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-[var(--color-text-primary)] truncate">Admin User</p>
          <p class="text-xs text-[var(--color-text-muted)] truncate">Administrator</p>
        </div>
      </div>
    </div>

  </aside>
  <!-- End Sidebar -->


  <!-- ══════════════════════════════════════════════════
       RIGHT PANEL  (header + scrollable content + footer)
  ══════════════════════════════════════════════════ -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">


    <!-- ── HEADER ────────────────────────────────── -->
    <header
      id="main-header"
      class="flex items-center shrink-0
             h-16 px-4 sm:px-6
             bg-[var(--color-surface)]
             border-b border-[var(--color-border)]"
      style="min-height: var(--header-height);"
      role="banner"
    >

      <!-- Mobile: hamburger (hidden on lg+) -->
      <button
        id="mobile-menu-btn"
        type="button"
        aria-label="Open navigation menu"
        class="lg:hidden flex items-center justify-center
               w-10 h-10 mr-3 -ml-1
               rounded-lg text-[var(--color-text-secondary)]
               hover:bg-[var(--color-nav-hover-bg)]
               focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
               transition-colors duration-150"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <line x1="3" y1="6"  x2="21" y2="6"  />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <!-- Spacer — pushes actions to the right -->
      <div class="flex-1 min-w-0"></div>

      <!-- Right-side header actions -->
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">

        <!-- Notification icon -->
        <button
          id="notification-btn"
          type="button"
          aria-label="View notifications"
          class="flex items-center justify-center
                 w-10 h-10 rounded-lg
                 text-[var(--color-text-secondary)]
                 hover:bg-[var(--color-nav-hover-bg)]
                 focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                 transition-colors duration-150"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <!-- User profile button -->
        <button
          id="user-menu-btn"
          type="button"
          aria-label="Open user menu"
          class="flex items-center gap-2
                 px-3 h-10 rounded-lg
                 text-sm font-medium
                 text-[var(--color-text-primary)]
                 hover:bg-[var(--color-nav-hover-bg)]
                 focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]
                 transition-colors duration-150"
        >
          <!-- Avatar -->
          <span
            class="flex items-center justify-center
                   w-7 h-7 rounded-full shrink-0
                   bg-[var(--color-primary-light)]
                   text-[var(--color-primary)]"
            aria-hidden="true"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <!-- Name + chevron (hidden on mobile) -->
          <span class="hidden sm:block truncate max-w-[120px]">Admin User</span>
          <svg
            class="hidden sm:block shrink-0"
            xmlns="http://www.w3.org/2000/svg" width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

      </div>

    </header>
    <!-- End Header -->


    <!-- ── MAIN  (scrollable area) ───────────────── -->
    <main
      id="main-content"
      class="flex-1 overflow-y-auto flex flex-col min-w-0"
      aria-label="Main content"
    >

      <!-- Content with responsive padding -->
      <section
        class="flex-1 p-4 sm:p-6 lg:p-8"
        aria-labelledby="page-heading"
      >
        <div class="mb-6">
          <h1
            id="page-heading"
            class="text-xl sm:text-2xl font-semibold
                   text-[var(--color-text-primary)]
                   leading-tight"
          >
            Dashboard
          </h1>
          <p class="mt-1 text-sm text-[var(--color-text-secondary)]">
            Dashboard content will appear here.
          </p>
        </div>

        <!--
          ┌─────────────────────────────────────────────────────────────┐
          │  Dashboard content placeholder.                             │
          │  Add statistics cards, charts, tables, etc. here later.    │
          └─────────────────────────────────────────────────────────────┘
        -->

      </section>

      <!-- ── FOOTER ─────────────────────────────── -->
      <footer
        id="main-footer"
        class="shrink-0
               border-t border-[var(--color-border)]
               bg-[var(--color-surface)]
               px-4 sm:px-6 lg:px-8
               py-4"
        role="contentinfo"
      >
        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between
                 gap-1 sm:gap-0
                 text-xs text-[var(--color-text-muted)]"
        >
          <span>© 2026 Admin Panel. All rights reserved.</span>
          <span>Version 1.0.0</span>
        </div>
      </footer>
      <!-- End Footer -->

    </main>
    <!-- End Main -->

  </div>
  <!-- End Right Panel -->


  <!-- App JS (placeholder) -->
  <script src="assets/js/app.js"></script>

</body>
</html>
